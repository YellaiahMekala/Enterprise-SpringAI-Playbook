spring.application.name=enterprise-springai-playbook

# Blocking LLM and HTTP calls run on virtual threads
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- OpenAI (secret: environment only) ---
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.image.model=gpt-image-1
# Heavy audio/image calls can be slow
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=180s
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- Database (chat memory). Secrets and hosts come from the environment ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spring_ai_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# 'always' creates the memory table on startup, convenient for local runs. Use 'never' plus a migration tool in production.
spring.ai.chat.memory.repository.jdbc.initialize-schema=${CHAT_MEMORY_INIT_SCHEMA:always}

# --- API security: caller id -> API key. Fails startup when empty ---
app.security.api-keys.demo-user=${APP_API_KEY:}

# --- Application settings ---
app.chat.max-messages=20
app.tools.weather.base-url=https://wttr.in
app.tools.news.base-url=https://newsapi.org/v2
app.tools.news.api-key=${NEWS_API_KEY:}
app.image.output-dir=${IMAGE_OUTPUT_DIR:./generated}

# --- Actuator: expose the minimum ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
