# Local debugging only (--spring.profiles.active=dev).
# DEBUG logs include prompts and responses: never enable this where real user data flows.
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG

# Convenience for local IDE runs only: a fixed, publicly known key so the app starts without setup.
# NEVER use the dev profile outside your machine; real deployments must set APP_API_KEY.
app.security.api-keys.demo-user=${APP_API_KEY:dev-local-key}
